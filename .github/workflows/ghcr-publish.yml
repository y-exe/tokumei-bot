name: イメージの検証と公開

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: ソースを取得
        uses: actions/checkout@v4

      - name: Docker Buildxを準備
        uses: docker/setup-buildx-action@v3

      - name: Docker内で型チェックとテスト
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          cache-from: |
            type=gha,scope=tokumei-test
            type=gha
          cache-to: type=gha,scope=tokumei-test,mode=max

      - name: 本番用の検証イメージを作成
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          load: true
          tags: tokumei-runtime-test:local
          cache-from: |
            type=gha,scope=tokumei-runtime
            type=gha
          cache-to: type=gha,scope=tokumei-runtime,mode=max

      - name: 読み取り専用・オフライン起動を検証
        run: >-
          docker run --rm --read-only --network none --memory 512m --cpus 1
          --tmpfs /tmp:rw,size=128m --user 1000:1000 tokumei-runtime-test:local
          bun -e "import { initializeSafety } from './src/media/safety.ts'; import { initializeNudity } from './src/media/nudity.ts'; import { checkMediaSafety } from './src/media/safety-policy.ts'; import { defaults } from './src/domain/config.ts'; import sharp from 'sharp'; await initializeSafety(); await initializeNudity(); const image = await sharp({create:{width:64,height:64,channels:3,background:'white'}}).png().toBuffer(); await checkMediaSafety(image, defaults, 'safe.png');"

      - name: コンテナレジストリにログイン
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: イメージのタグを設定
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=long

      - name: 検証済みイメージを公開
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=tokumei-runtime
          cache-to: type=gha,scope=tokumei-runtime,mode=max
